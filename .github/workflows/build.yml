name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.2

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=耀.jks
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-keeper-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: screen-keeper-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Get Version
        id: version
        run: echo "version=$(grep 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ScreenKeeper v${{ steps.version.outputs.version }}
          body: |
            ## ScreenKeeper v${{ steps.version.outputs.version }} - 屏幕常亮

            ### 下载
            安装 `app-release.apk` 即可（需开启"允许安装未知来源应用"）。

            ### 功能
            - 屏幕常亮，前后台均生效
            - 低亮度模式，亮度可降至 1%
            - 亮度滑块调节 1%-100%
            - 开机自启，重启自动恢复
            - 悬浮窗保活，广泛兼容各品牌
          files: |
            app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
